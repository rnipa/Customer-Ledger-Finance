<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Ledger v3.4 Fixed</title>
<style>
body{
font-family:Arial,sans-serif;
margin:0;
padding:24px;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
min-height:100vh;
color:#1f2937;
}
.wrap{max-width:900px;margin:auto}.card{
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
padding:18px;
border-radius:18px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
border:1px solid rgba(255,255,255,.4);
}
input,select,button{width:100%;padding:10px;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;border:none;border-radius:12px;font-weight:bold;transition:.2s}.danger{background:#dc3545}
.item{border:1px solid #dbeafe;border-radius:12px;padding:12px;margin-top:8px;cursor:pointer;background:#f8fbff}
</style></head><body><div class="wrap">
<div class="card"><h2>💳 Customer Ledger v3.5 Fixed</h2><p style='margin-top:6px;color:#475569'>Modern Dashboard Preview</p>
<div class="row">
<div><b id="totalCustomers">0</b><br><small>কাস্টমার</small></div>
<div><b id="totalBalance">৳0</b><br><small>মোট ব্যালেন্স</small></div><div><b id="totalCommission">৳0</b><br><small>মোট কমিশন</small></div>
</div>
</div>
<div class="card"><input id="n" placeholder="নাম"><input id="m" type="tel" inputmode="tel" autocomplete="tel" placeholder="মোবাইল: 017XXXXXXXX / +88017XXXXXXXX">
<button onclick="add()">কাস্টমার যোগ করুন</button></div>
<div class="card"><input id="q" placeholder="সার্চ" oninput="draw()"><div id="list"></div></div>
<div class="card">
<div id="sel">কাস্টমার নির্বাচন করুন</div>
<select id="t"><option value="receive">গ্রহণ</option><option value="withdraw">প্রদান</option></select>
<input id="a" type="number" placeholder="টাকার পরিমাণ">
<input id="r" type="number" value="5" placeholder="প্রতি ১০০০ চার্জ">
<div class="row"><button onclick="tx()">সংরক্ষণ</button><button onclick="editCustomer()">এডিট</button></div><div class="row"><button onclick="clearForm()">ফর্ম ক্লিয়ার</button><button class="danger" onclick="del()">ডিলিট</button></div>
</div>
<div class="card">
<h3>👤 Customer Profile</h3>
<div id="profile">কাস্টমার নির্বাচন করুন</div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px">
<button onclick="printLedger()">🖨️ Print</button>
<button onclick="backupData()">💾 Backup</button>
<button onclick="document.getElementById('restoreFile').click()">📂 Restore</button><input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restoreData(event)">
<button onclick="document.getElementById('his').scrollIntoView({behavior:'smooth'})">📝 Tx Edit/Delete</button>
</div>
</div>
<div class="card"><h3>📒 Ledger Statement</h3><div id="his"></div></div>

<script>
const STORAGE_KEY="customer_ledger_v35";
let db=[],cur=null;

const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}

function load(){
 try{
  db=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  if(!Array.isArray(db))db=[];
  db.forEach(c=>{c.tx=Array.isArray(c.tx)?c.tx:[];c.balance=Number(c.balance)||0;});
 }catch(e){db=[];}
}

function normalizeMobile(v){
 let s=String(v||"").trim().replace(/\s+/g,"");
 if(s.startsWith("+880"))s=s.substring(1);
 if(s.startsWith("01"))s="880"+s;
 return s;
}

function validMobile(v){return !v||/^8801\d{9}$/.test(v);}

function esc(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
 .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function updateStats(){
 $("totalCustomers").textContent=db.length;
 $("totalBalance").textContent="৳"+db.reduce((s,c)=>s+Number(c.balance||0),0).toFixed(2);
 $("totalCommission").textContent="৳"+db.reduce((s,c)=>s+(c.tx||[]).reduce((x,t)=>x+Number(t.charge||0),0),0).toFixed(2);
}

function add(){
 const name=$("n").value.trim();
 const mobile=normalizeMobile($("m").value);

 if(!name)return alert("কাস্টমারের নাম লিখুন।");
 if(!validMobile(mobile))return alert("সঠিক মোবাইল নম্বর দিন। উদাহরণ: 017XXXXXXXX বা +88017XXXXXXXX");
 if(db.some(c=>c.mobile===mobile&&mobile))return alert("এই মোবাইল নম্বর আগে থেকেই আছে।");

 const c={id:uid(),name,mobile,balance:0,tx:[]};
 db.push(c);cur=c;save();
 $("n").value="";$("m").value="";
 draw();selectCustomer(c.id);
 alert("কাস্টমার সফলভাবে যোগ হয়েছে।");
}

function selectCustomer(id){
 cur=db.find(c=>c.id===id)||null;
 if(!cur)return;
 $("sel").innerHTML=`<b>${esc(cur.name)}</b> | ৳${cur.balance.toFixed(2)}`;
 $("profile").innerHTML=`<b>${esc(cur.name)}</b><br>📱 ${esc(cur.mobile||"নম্বর নেই")}<br>💰 ৳${cur.balance.toFixed(2)}`;
 historyView();
}

function draw(){
 updateStats();
 const k=$("q").value.trim().toLowerCase();
 $("list").innerHTML="";
 const rows=db.filter(c=>c.name.toLowerCase().includes(k)||c.mobile.includes(k));
 if(!rows.length){$("list").innerHTML="<div class='item'>কোন কাস্টমার নেই</div>";return;}
 rows.forEach(c=>{
  const d=document.createElement("div");
  d.className="item";
  d.innerHTML=`<b>${esc(c.name)}</b><br>📱 ${esc(c.mobile||"নম্বর নেই")}<br>💰 ৳${c.balance.toFixed(2)}`;
  d.onclick=()=>selectCustomer(c.id);
  $("list").appendChild(d);
 });
}

function historyView(){
 if(!cur){$("his").innerHTML="কাস্টমার নির্বাচন করুন";return;}
 const txs=cur.tx.slice().reverse();
 if(!txs.length){$("his").innerHTML="কোন লেনদেন নেই";return;}
 $("his").innerHTML=txs.map(t=>`
 <div class="item">
 <b>${t.type==="receive"?"🟢 গ্রহণ":"🔴 প্রদান"}</b><br>
 📅 ${new Date(t.date).toLocaleString("bn-BD")}<br>
 💵 ৳${Number(t.amount).toFixed(2)}<br>
 💳 চার্জ: ৳${Number(t.charge||0).toFixed(2)}<br>
 💰 ব্যালেন্স: ৳${Number(t.balance).toFixed(2)}
 <div class="row">
 <button onclick="editTx('${t.id}')">✏️ Edit</button>
 <button class="danger" onclick="deleteTx('${t.id}')">🗑️ Delete</button>
 </div></div>`).join("");
}

function tx(){
 if(!cur)return alert("কাস্টমার নির্বাচন করুন।");
 const amount=Number($("a").value);
 if(!amount||amount<=0)return alert("সঠিক টাকার পরিমাণ লিখুন।");

 const type=$("t").value;
 const rate=Math.max(0,Number($("r").value)||0);
 let charge=type==="receive"?Math.floor(amount/1000)*rate:0;
 let net=type==="receive"?amount-charge:amount;

 if(type==="receive")cur.balance+=net;
 else cur.balance-=amount;

 const t={id:uid(),date:new Date().toISOString(),type,amount,charge,net,balance:cur.balance};
 cur.tx.push(t);

 save();draw();selectCustomer(cur.id);
 $("a").value="";

 if(cur.mobile){
  const number=normalizeMobile(cur.mobile);
  const msg=type==="receive"
   ? `🏪 Rubaiya Pharmacy\n\nপ্রিয় ${cur.name},\n\nআপনার থেকে গ্রহণ: ৳${amount.toFixed(2)}\nসার্ভিস চার্জ: ৳${charge.toFixed(2)}\nব্যালেন্সে যোগ: ৳${net.toFixed(2)}\n\nবর্তমান ব্যালেন্স: ৳${cur.balance.toFixed(2)}`
   : `🏪 Rubaiya Pharmacy\n\nপ্রিয় ${cur.name},\n\nআপনাকে প্রদান করা হয়েছে: ৳${amount.toFixed(2)}\n\nসার্ভিস চার্জ: ৳0.00\nবর্তমান ব্যালেন্স: ৳${cur.balance.toFixed(2)}`;
  window.open("https://wa.me/"+number+"?text="+encodeURIComponent(msg),"_blank");
 }
}

function editTx(id){
 if(!cur)return;
 const t=cur.tx.find(x=>x.id===id);
 if(!t)return;
 const amount=Number(prompt("নতুন টাকার পরিমাণ:",t.amount));
 if(!amount||amount<=0)return;
 const type=prompt("receive অথবা withdraw:",t.type);
 if(type!=="receive"&&type!=="withdraw")return alert("সঠিক type দিন।");

 t.amount=amount;t.type=type;
 recalc();
 save();draw();selectCustomer(cur.id);
}

function deleteTx(id){
 if(!cur||!confirm("এই লেনদেনটি মুছে ফেলবেন?"))return;
 cur.tx=cur.tx.filter(t=>t.id!==id);
 recalc();save();draw();selectCustomer(cur.id);
}

function recalc(){
 let balance=0;
 const rate=Math.max(0,Number($("r").value)||5);
 cur.tx.sort((a,b)=>new Date(a.date)-new Date(b.date));
 cur.tx.forEach(t=>{
  if(t.type==="receive"){
   t.charge=Math.floor(Number(t.amount)/1000)*rate;
   t.net=Number(t.amount)-t.charge;
   balance+=t.net;
  }else{
   t.charge=0;t.net=Number(t.amount);balance-=t.amount;
  }
  t.balance=balance;
 });
 cur.balance=balance;
}

function editCustomer(){
 if(!cur)return alert("কাস্টমার নির্বাচন করুন।");
 const name=prompt("নাম:",cur.name);
 if(name===null)return;
 const mobile=normalizeMobile(prompt("মোবাইল:",cur.mobile?"+"+cur.mobile:""));
 if(!validMobile(mobile))return alert("সঠিক মোবাইল নম্বর দিন।");
 if(db.some(c=>c.id!==cur.id&&c.mobile===mobile&&mobile))return alert("এই নম্বর অন্য কাস্টমারের আছে।");
 cur.name=name.trim();cur.mobile=mobile;save();draw();selectCustomer(cur.id);
}

function del(){
 if(!cur)return alert("কাস্টমার নির্বাচন করুন।");
 if(!confirm("কাস্টমার ও সব লেনদেন মুছে ফেলবেন?"))return;
 db=db.filter(c=>c.id!==cur.id);cur=null;save();
 $("sel").textContent="কাস্টমার নির্বাচন করুন";$("profile").textContent="কাস্টমার নির্বাচন করুন";$("his").innerHTML="";draw();
}

function clearForm(){
 $("n").value="";$("m").value="";$("a").value="";cur=null;
 $("sel").textContent="কাস্টমার নির্বাচন করুন";$("profile").textContent="কাস্টমার নির্বাচন করুন";$("his").innerHTML="";
}

function backupData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="customer-ledger-backup.json";a.click();
}

function restoreData(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;db=x;save();cur=null;draw();alert("Backup Restore সফল হয়েছে।");}catch(_){alert("Invalid backup file.");}};
 r.readAsText(f);e.target.value="";
}

function printLedger(){
 if(!cur)return alert("কাস্টমার নির্বাচন করুন।");
 const w=window.open("","_blank");if(!w)return alert("Popup allow করুন।");
 w.document.write(`<html><head><title>Ledger</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px}</style></head><body>
 <h2>Customer Ledger Statement</h2><p><b>${esc(cur.name)}</b><br>${esc(cur.mobile)}<br>Balance: ৳${cur.balance.toFixed(2)}</p>
 <table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Charge</th><th>Balance</th></tr>
 ${cur.tx.map(t=>`<tr><td>${new Date(t.date).toLocaleString("bn-BD")}</td><td>${t.type}</td><td>৳${t.amount}</td><td>৳${t.charge}</td><td>৳${t.balance}</td></tr>`).join("")}</table></body></html>`);
 w.document.close();w.onload=()=>w.print();
}

load();draw();
</script>
</body></html>
