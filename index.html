<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Ledger v3.4 Fixed</title>
<style>
body{
font-family:Arial,sans-serif;
margin:0;
padding:24px;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
min-height:100vh;
color:#1f2937;
}
.wrap{max-width:900px;margin:auto}.card{
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
padding:18px;
border-radius:18px;
margin-bottom:16px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
border:1px solid rgba(255,255,255,.4);
}
input,select,button{width:100%;padding:10px;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;border:none;border-radius:12px;font-weight:bold;transition:.2s}.danger{background:#dc3545}
.item{border:1px solid #dbeafe;border-radius:12px;padding:12px;margin-top:8px;cursor:pointer;background:#f8fbff}
</style></head><body><div class="wrap">
<div class="card"><h2>💳 Customer Ledger v3.2 Premium UI</h2><p style='margin-top:6px;color:#475569'>Modern Dashboard Preview</p>
<div class="row">
<div><b id="totalCustomers">0</b><br><small>কাস্টমার</small></div>
<div><b id="totalBalance">৳0</b><br><small>মোট ব্যালেন্স</small></div><div><b id="totalCommission">৳0</b><br><small>মোট কমিশন</small></div>
</div>
</div>
<div class="card"><input id="n" placeholder="নাম"><input id="m" placeholder="মোবাইল">
<button onclick="add()">কাস্টমার যোগ করুন</button></div>
<div class="card"><input id="q" placeholder="সার্চ" oninput="draw()"><div id="list"></div></div>
<div class="card">
<div id="sel">কাস্টমার নির্বাচন করুন</div>
<select id="t"><option value="receive">গ্রহণ</option><option value="withdraw">প্রদান</option></select>
<input id="a" type="number" placeholder="টাকার পরিমাণ">
<input id="r" type="number" value="5" placeholder="প্রতি ১০০০ চার্জ">
<div class="row"><button onclick="tx()">সংরক্ষণ</button><button onclick="editCustomer()">এডিট</button></div><div class="row"><button onclick="clearForm()">ফর্ম ক্লিয়ার</button><button class="danger" onclick="del()">ডিলিট</button></div>
</div>
<div class="card">
<h3>👤 Customer Profile</h3>
<div id="profile">কাস্টমার নির্বাচন করুন</div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px">
<button onclick="printLedger()">🖨️ Print</button>
<button onclick="backupData()">💾 Backup</button>
<button onclick="document.getElementById('restoreFile').click()">📂 Restore</button><input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restoreData(event)">
<button onclick="alert('Transaction edit/delete will be implemented in the next build.')">📝 Tx Edit/Delete</button>
</div>
</div>
<div class="card"><h3>📒 Ledger Statement</h3><div id="his"></div></div>
<script>
const STORAGE_KEY="customer_ledger_v34";
let db=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"),cur=null;
const save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(db));

function updateStats(){
 totalCustomers.textContent=db.length;
 let bal=db.reduce((s,c)=>s+(c.balance||0),0);
let com=0;
db.forEach(c=>(c.tx||[]).forEach(t=>{
 let m=(t.msg||"").match(/চার্জ: ৳(\d+)/);
 if(m) com+=Number(m[1]);
}));
totalBalance.textContent="৳"+bal.toFixed(2);
if(document.getElementById("totalCommission"))
 totalCommission.textContent="৳"+com.toFixed(2);
}

function add(){
 if(!n.value.trim()) return alert("নাম দিন");
 if(m.value.trim() && !/^01\d{9}$/.test(m.value.trim())){
   return alert("সঠিক মোবাইল নম্বর লিখুন");
 }
 if(db.some(x=>x.mobile===m.value.trim()&&m.value.trim()!=="")) return alert("এই মোবাইল নম্বর আগে থেকেই আছে");
 db.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString()),name:n.value.trim(),mobile:m.value.trim(),balance:0,tx:[]});
 n.value="";m.value="";
 save();
draw();
}

function backupData(){
 const data=JSON.stringify(db,null,2);
 const blob=new Blob([data],{type:'application/json'});
 const link=document.createElement('a');
 link.href=URL.createObjectURL(blob);
 link.download='ledger-backup.json';
 link.click();
}

function restoreData(e){
 const f=e.target.files[0];
 if(!f) return;
 const r=new FileReader();
 r.onload=function(){
   try{
     db=JSON.parse(r.result);
     save();
     draw();
     alert('Backup restored successfully');
   }catch(err){
     alert('Invalid backup file');
   }
 };
 r.readAsText(f);
}


function draw(){
 updateStats();
 list.innerHTML="";
 const k=q.value.toLowerCase();
 const rows=db.filter(x=>x.name.toLowerCase().includes(k)||x.mobile.includes(k));
 if(!rows.length){list.innerHTML="কোন কাস্টমার নেই";return;}
 rows.forEach(c=>{
   let d=document.createElement("div");
   d.className="item";
   d.innerHTML=`<b>${c.name}</b><br>${c.mobile}<br>৳${c.balance.toFixed(2)}`;
   d.onclick=()=>{cur=c;sel.innerHTML=`<b>${c.name}</b> | ৳${c.balance.toFixed(2)}`;profile.innerHTML=`<b>${c.name}</b><br>📱 ${c.mobile}<br>💰 ৳${c.balance.toFixed(2)}`;historyView();};
   list.appendChild(d);
 });
}

function historyView(){
 his.innerHTML=(cur?.tx||[]).slice().reverse().map(x=>"<div class='item'>"+x.msg+"</div>").join("")||"কোন লেনদেন নেই";
}

function tx(){
 if(!cur) return alert("কাস্টমার নির্বাচন করুন");
 let amt=+a.value;if(amt<=0)return;
 let charge=0,net=amt,msg="",wa="";
 if(t.value==="receive"){
   charge=Math.floor(amt/1000)*(+r.value||5);
   net=amt-charge;
   cur.balance+=net;
   msg=`📅 ${new Date().toLocaleString()}<br>গ্রহণ: ৳${amt}<br>চার্জ: ৳${charge}<br>যোগ: ৳${net}<br>ব্যালেন্স: ৳${cur.balance}`;
   wa=`Rubaiya Pharmacy

প্রিয় ${cur.name}

আপনার থেকে গ্রহণ: ৳${amt}
সার্ভিস চার্জ: ৳${charge}
ব্যালেন্সে যোগ: ৳${net}

বর্তমান ব্যালেন্স: ৳${cur.balance}`;
 }else{
   cur.balance-=amt;
   msg=`📅 ${new Date().toLocaleString()}<br>প্রদান: ৳${amt}<br>চার্জ: ৳0<br>ব্যালেন্স: ৳${cur.balance}`;
   wa=`Rubaiya Pharmacy

প্রিয় ${cur.name}

আপনাকে প্রদান করা হয়েছে: ৳${amt}

বর্তমান ব্যালেন্স: ৳${cur.balance}`;
 }
 cur.tx.push({
 id: crypto.randomUUID?crypto.randomUUID():Date.now().toString(),
 date:new Date().toISOString(),
 type:t.value,
 amount:amt,
 charge:charge,
 net:net,
 balance:cur.balance,
 msg:msg
});
 save();draw();historyView();
 window.open("https://wa.me/"+cur.mobile+"?text="+encodeURIComponent(wa),"_blank");
 a.value="";
}




function printLedger(){
 if(!cur){alert('কাস্টমার নির্বাচন করুন');return;}
 const w=window.open('','_blank');
 w.document.write('<h2>Ledger Statement</h2>'+profile.innerHTML+'<hr>'+his.innerHTML);
 w.print();
}

function clearForm(){
 n.value="";
 m.value="";
 a.value="";
 cur=null;
 sel.textContent="কাস্টমার নির্বাচন করুন";
}

function editCustomer(){
 if(!cur) return alert("কাস্টমার নির্বাচন করুন");
 n.value=cur.name;
 m.value=cur.mobile;
 if(confirm("বর্তমান তথ্য দিয়ে আপডেট করবেন?")){
   cur.name=n.value.trim();
   cur.mobile=m.value.trim();
   save();
   draw();
 }
}

function del(){
 if(!cur)return;
 if(confirm("ডিলিট করবেন?")){
   db=db.filter(x=>x.id!==cur.id);
   save();cur=null;sel.textContent="কাস্টমার নির্বাচন করুন";his.innerHTML="";draw();
 }
}
draw();
</script></body></html>
